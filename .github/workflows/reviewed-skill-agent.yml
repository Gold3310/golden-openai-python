name: Reviewed-skill agent checks

on:
  pull_request:
    paths:
      - "examples/reviewed_skill_agent/**"
      - "examples/__init__.py"
      - "supabase/**"
      - ".github/workflows/reviewed-skill-agent.yml"
  push:
    branches:
      - "feat/reviewed-skill-agent-*"
    paths:
      - "examples/reviewed_skill_agent/**"
      - "examples/__init__.py"
      - "supabase/**"
      - ".github/workflows/reviewed-skill-agent.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install SDK and lint tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff
      - name: Compile example
        run: python -m compileall -q examples/reviewed_skill_agent
      - name: Run unit tests
        run: python -m unittest discover -s examples/reviewed_skill_agent -p 'test_*.py'
      - name: Lint example
        run: ruff check examples/reviewed_skill_agent

  supabase-rls-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Apply migration and run pgTAP policies
        run: supabase test db
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
