name: Reviewed-skill agent checks

on:
  pull_request:
    paths:
      - "examples/reviewed_skill_agent/**"
      - "supabase/schema/agent_audit_events.sql"
      - "supabase/tests/agent_audit_events_rls_test.sql"
      - ".github/workflows/reviewed-skill-agent.yml"
  push:
    branches:
      - "feat/reviewed-skill-developer-agent"
    paths:
      - "examples/reviewed_skill_agent/**"
      - "supabase/schema/agent_audit_events.sql"
      - "supabase/tests/agent_audit_events_rls_test.sql"
      - ".github/workflows/reviewed-skill-agent.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install SDK and lint tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff
      - name: Compile example
        run: python -m compileall -q examples/reviewed_skill_agent
      - name: Run unit tests
        run: python -m unittest discover -s examples/reviewed_skill_agent -p 'test_*.py'
      - name: Show Ruff's import fixes
        run: |
          ruff check --fix examples/reviewed_skill_agent || true
          git diff -- examples/reviewed_skill_agent
          ruff check examples/reviewed_skill_agent
